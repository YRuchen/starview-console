replicaCount: 1
fullnameOverride: frontend
service:
  type: ClusterIP
  port: 80
  targetPort: 80
image:
  repository: harbor.gainetics.io/observable/images/obs-frontend
  pullPolicy: Always
  tag: v1.1.0-e122c23-202510292249
imagePullSecrets:
- name: docker-registry-secret
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
ingress:
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/subnets: subnet-0fe306514d06a67fc,subnet-0f0558867a3a0c067,subnet-0d830c937aaefc8b9
    alb.ingress.kubernetes.io/group.name: gainetics-eks-dev
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:281179910090:certificate/db238f1d-5c74-4b87-887a-ed47b993f880
  hosts:
  - host: www.observe.dev.eks.gainetics.io
    paths:
    - path: /
      pathType: Prefix
  tls: []
env:
  NODE_ENV: development
  VITE_APP_BASE_API: ''
  VITE_APP_BASE_API_METRICS: https://alert-manager.observe.dev.gainetics.io
  VITE_APP_BASE_API_AVAILABILITY: https://gateway.observe.dev.eks.gainetics.io
  VITE_APP_BASE_API_DOMAIN: https://gateway.observe.dev.eks.gainetics.io/domain/api/v1
  VITE_APP_BASE_API_AIAGENT: https://gateway.observe.dev.eks.gainetics.io
  VITE_APP_USER_API: https://gateway.observe.dev.eks.gainetics.io/api/user
  VITE_APP_CORE_API: https://gateway.observe.dev.eks.gainetics.io/api/core
serviceAccount:
  create: false
  name: scloud-obs-dev-read-write
  automount: false
autoscaling:
  enabled: false
nginx:
  config: "worker_processes  1;\n\nevents {\n    worker_connections  1024;\n}\n\n\
    http {\n    include       /etc/nginx/mime.types;\n    include       /etc/nginx/conf.d/*.conf;\n\
    \    default_type  application/octet-stream;\n    sendfile        on;\n    keepalive_timeout\
    \  65;\n\n    server {\n        listen       80;\n        server_name  wwww.observe.gainetics.io;\n\
    \n        location / {\n            root   /usr/share/nginx/html;\n          \
    \  index  index.html index.htm;\n            try_files $uri $uri/ /index.html;\n\
    \n            # \u6DFB\u52A0\u5FC5\u8981\u7684\u54CD\u5E94\u5934\u4EE5\u652F\u6301\
    \u8DE8\u57DFcookie\n            add_header 'Access-Control-Allow-Origin' 'https://gateway.observe.gainetics.io'\
    \ always;\n            add_header 'Access-Control-Allow-Credentials' 'true' always;\n\
    \            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE,\
    \ OPTIONS' always;\n            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With'\
    \ always;\n        }\n\n        # API\u4EE3\u7406\u914D\u7F6E - \u786E\u4FDDcookie\u80FD\
    \u6B63\u786E\u4F20\u9012\n        location /api/ {\n            proxy_pass https://gateway.observe.gainetics.io/api/;\n\
    \            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP\
    \ $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header X-Forwarded-Proto $scheme;\n\n            # \u5173\
    \u952E: \u4FDD\u6301cookie\u4F20\u9012\n            proxy_pass_request_headers\
    \ on;\n            proxy_pass_header Set-Cookie;\n            proxy_cookie_domain\
    \ gateway.observe.gainetics.io wwww.observe.gainetics.io;\n\n            # CORS\u652F\
    \u6301\n            add_header 'Access-Control-Allow-Origin' '$http_origin' always;\n\
    \            add_header 'Access-Control-Allow-Credentials' 'true' always;\n  \
    \          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE,\
    \ OPTIONS' always;\n            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With'\
    \ always;\n\n            # \u5904\u7406\u9884\u68C0\u8BF7\u6C42\n            if\
    \ ($request_method = 'OPTIONS') {\n                return 204;\n            }\n\
    \        }\n\n        error_page   500 502 503 504  /50x.html;\n        location\
    \ = /50x.html {\n            root   /usr/share/nginx/html;\n        }\n    }\n\
    }\n"
