# Development environment values for obs-frontend
replicaCount: 1

fullnameOverride: "frontend"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

image:
  repository: "harbor.gainetics.io/observable/images/obs-frontend"
  pullPolicy: Always
  tag: "v1.0.1-07a3adc-202510041549"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  className: "alb"
  annotations:
    # ALB Ingress Controller 配置
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # 🔧 添加关键配置 - 与 nightingale 保持一致
    alb.ingress.kubernetes.io/subnets: subnet-0fe306514d06a67fc,subnet-0f0558867a3a0c067,subnet-0d830c937aaefc8b9
    alb.ingress.kubernetes.io/group.name: gainetics-eks-dev
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:281179910090:certificate/db238f1d-5c74-4b87-887a-ed47b993f880
  hosts:
    - host: www.observe.dev.eks.gainetics.io
      paths:
        - path: /
          pathType: Prefix
  # 🔧 使用 ACM 证书，不需要 TLS secret
  tls: []

# Development environment configuration
env:
  NODE_ENV: "development"

  # API 端点配置 - 开发环境
  VITE_APP_BASE_API: ""
  VITE_APP_BASE_API_METRICS: "https://alert-manager.observe.dev.gainetics.io"
  VITE_APP_BASE_API_AVAILABILITY: "https://gateway.observe.dev.eks.gainetics.io"
  VITE_APP_BASE_API_DOMAIN: "https://gateway.observe.dev.eks.gainetics.io/domain/api/v1"
  VITE_APP_BASE_API_AIAGENT: "https://gateway.observe.dev.eks.gainetics.io"

  # 内部服务配置 - 开发环境（统一通过网关访问）
  VITE_APP_USER_API: "https://gateway.observe.dev.eks.gainetics.io/api/user"
  VITE_APP_CORE_API: "https://gateway.observe.dev.eks.gainetics.io/api/core"

# ServiceAccount configuration - 使用默认 ServiceAccount
serviceAccount:
  create: false  # 使用默认的 ServiceAccount
  name: "scloud-obs-prod-read-write"  # 空字符串表示使用默认 ServiceAccount
  automount: false  # 🔒 安全：禁用 API 凭据自动挂载

autoscaling:
  enabled: false

# Nginx configuration
nginx:
  config: |
    worker_processes  1;
    
    events {
        worker_connections  1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;
    
        server {
            listen       80;
            server_name  wwww.observe.gainetics.io;
    
            location / {
                root   /usr/share/nginx/html;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
    
                # 添加必要的响应头以支持跨域cookie
                add_header 'Access-Control-Allow-Origin' 'https://gateway.observe.gainetics.io' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
            }
    
            # API代理配置 - 确保cookie能正确传递
            location /api/ {
                proxy_pass https://gateway.observe.gainetics.io/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
    
                # 关键：保持cookie传递
                proxy_pass_request_headers on;
                proxy_pass_header Set-Cookie;
                proxy_cookie_domain gateway.observe.gainetics.io wwww.observe.gainetics.io;
    
                # CORS支持
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
    
                # 处理预检请求
                if ($request_method = 'OPTIONS') {
                    return 204;
                }
            }
    
            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /usr/share/nginx/html;
            }
        }
    }
