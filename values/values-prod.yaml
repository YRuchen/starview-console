# Production environment values for obs-frontend
replicaCount: 3

fullnameOverride: "frontend"

image:
  repository: "harbor.gainetics.io/observable/images/obs-frontend"
  pullPolicy: IfNotPresent
  tag: "1.0.31-prod"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  # 禁用 Helm ingress，因为使用托管的 ALB ingress
  enabled: false
  # 托管 ingress 配置信息（仅作参考）:
  # - namespace: scloud-obs-prod
  # - 域名: wwww.observe.gainetics.io (4个w)
  # - ALB ingress controller
  # - 后端服务: frontend:80

# ServiceAccount configuration - 使用默认 ServiceAccount
serviceAccount:
  create: false  # 使用默认的 ServiceAccount
  name: "scloud-obs-prod-read-write"  # 空字符串表示使用默认 ServiceAccount
  automount: false  # 🔒 安全：禁用 API 凭据自动挂载

# Production environment configuration
env:
  NODE_ENV: "production"

  # API 端点配置 - 生产环境（使用托管域名 wwww.observe.gainetics.io）
  VITE_APP_BASE_API: "https://wwww.observe.gainetics.io"
  VITE_APP_BASE_API_METRICS: "https://alert-manager.observe.gainetics.io"
  VITE_APP_BASE_API_AVAILABILITY: "https://gateway.observe.gainetics.io"
  VITE_APP_BASE_API_DOMAIN: "https://gateway.observe.gainetics.io/domain/api/v1"
  VITE_APP_BASE_API_AIAGENT: "https://gateway.observe.gainetics.io"

  # 内部服务配置 - 生产环境（通过托管域名访问）
  VITE_APP_USER_API: "https://wwww.observe.gainetics.io/api/user"
  VITE_APP_CORE_API: "https://wwww.observe.gainetics.io/api/core"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
