# Production environment values for obs-frontend
replicaCount: 3

fullnameOverride: "frontend"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

image:
  repository: "harbor.gainetics.io/observable/images/obs-frontend"
  pullPolicy: IfNotPresent
  tag: v1.3.0-bc87048-202512032329

imagePullSecrets:
  - name: docker-registry-secret

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  # 禁用 Helm ingress，因为使用托管的 ALB ingress
  enabled: false
  # 托管 ingress 配置信息（仅作参考）:
  # - namespace: scloud-obs-prod
  # - 域名: wwww.observe.gainetics.io (4个w)
  # - ALB ingress controller
  # - 后端服务: frontend:80

# Production environment configuration
env:
  NODE_ENV: "production"

  # API 端点配置 - 生产环境（使用托管域名 wwww.observe.gainetics.io）
  VITE_APP_BASE_API: "https://wwww.observe.gainetics.io"
  VITE_APP_BASE_API_METRICS: "https://alert-manager.observe.gainetics.io"
  VITE_APP_BASE_API_AVAILABILITY: "https://gateway.observe.gainetics.io"
  VITE_APP_BASE_API_DOMAIN: "https://gateway.observe.gainetics.io/domain/api/v1"
  VITE_APP_BASE_API_AIAGENT: "https://gateway.observe.gainetics.io"

  # 内部服务配置 - 生产环境（通过托管域名访问）
  VITE_APP_USER_API: "https://wwww.observe.gainetics.io/api/user"
  VITE_APP_CORE_API: "https://wwww.observe.gainetics.io/api/core"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Nginx configuration
nginx:
  config: |
    worker_processes  1;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        include       /etc/nginx/conf.d/*.conf;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;

        server {
            listen       80;
            server_name  wwww.observe.gainetics.io;

            location / {
                root   /usr/share/nginx/html;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;

                # 添加必要的响应头以支持跨域cookie
                add_header 'Access-Control-Allow-Origin' 'https://gateway.observe.gainetics.io' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
            }

            # API代理配置 - 确保cookie能正确传递
            location /api/ {
                proxy_pass https://gateway.observe.gainetics.io/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # 关键: 保持cookie传递
                proxy_pass_request_headers on;
                proxy_pass_header Set-Cookie;
                proxy_cookie_domain gateway.observe.gainetics.io wwww.observe.gainetics.io;

                # CORS支持
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

                # 处理预检请求
                if ($request_method = 'OPTIONS') {
                    return 204;
                }
            }

            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /usr/share/nginx/html;
            }
        }
    }
