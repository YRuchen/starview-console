# Production environment values for obs-frontend
replicaCount: 3

fullnameOverride: "frontend"

image:
  repository: "harbor.gainetics.io/observable/images/obs-frontend-prod"
  pullPolicy: IfNotPresent
  tag: "1.0.0"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: www.observe.gainetics.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: obs-frontend-prod-tls
      hosts:
        - www.observe.gainetics.io

# ServiceAccount configuration - 使用默认 ServiceAccount
serviceAccount:
  create: false  # 使用默认的 ServiceAccount
  name: "scloud-obs-prod-read-write"  # 空字符串表示使用默认 ServiceAccount
  automount: false  # 🔒 安全：禁用 API 凭据自动挂载

# Production environment configuration
env:
  NODE_ENV: "production"

  # API 端点配置 - 生产环境
  VITE_APP_BASE_API: "https://www.observe.gainetics.io"
  VITE_APP_BASE_API_METRICS: "https://alert-manager.observe.gainetics.io"
  VITE_APP_BASE_API_AVAILABILITY: "https://gateway.observe.gainetics.io"
  VITE_APP_BASE_API_DOMAIN: "https://gateway.observe.gainetics.io/domain/api/v1"
  VITE_APP_BASE_API_AIAGENT: "https://gateway.observe.gainetics.io"

  # 内部服务配置 - 生产环境
  VITE_APP_USER_API: "https://www.observe.gainetics.io/api/user"
  VITE_APP_CORE_API: "https://www.observe.gainetics.io/api/core"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  node-role: frontend

tolerations:
  - key: "frontend-only"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
